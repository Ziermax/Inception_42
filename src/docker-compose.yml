services:

  nginx:
    build:
      context: requirements/nginx
    image: nginx
    container_name: nginx
    restart: always
    networks:
      - incepnet
    depends_on:
      - worldpress
    volumes:
      - wp_files:/var/www/html:ro


  worldpress:
    build: 
      context: requirements/worldpress
    image: worldpress
    container_name: worldpress
    restart: always
    networks:
      - incepnet
    depends_on:
      - mariadb
    volumes:
      - wp_files:/var/www/html
    env_file:
      - .env
    secrets:
      - db_root_password
      - db_password

  mariadb:
    build:
      context: requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: always
    networks:
      - incepnet
    volumes:
      - wp_database:/var/lib/mysql
    env_file:
      - .env
    secrets:
      - db_root_password
      - db_password

volumes:

  wp_database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wp_database

  wp_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wp_files

networks:
  incepnet:
    driver: bridge

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
