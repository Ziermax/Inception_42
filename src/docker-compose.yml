services:

  nginx:
    build: 
      context: requirements/nginx
#      args:
#        DOMAIN_NAME: ${DOMAIN_NAME}
    image: nginx
    container_name: nginx
    restart: always
    networks:
      - incepnet
    depends_on:
      - wordpress
    volumes:
      - wordpress_data:/var/www/html:ro
      - ./requirements/nginx/conf:/etc/nginx/conf.d:ro
    ports:
      - "443:443"

  wordpress:
    build:
      context:  requirements/wordpress
    image: wordpress
    container_name: wordpress
    restart: always
    networks:
      - incepnet
    depends_on:
      - mariadb
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .env
    secrets:
      - db_root_password
      - db_password

  mariadb:
    build:
      context: requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: always
    networks:
      - incepnet
    volumes:
      - mariadb_data:/var/lib/mysql
    env_file:
      - .env
    secrets:
      - db_root_password
      - db_password

volumes:

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/WordPress
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/DB

networks:

  incepnet:
    driver: bridge

secrets:

  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
